
[mcp_servers.filesystem]
command = "pnpm"
args = ["dlx", "-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
cwd = "/tmp"

[mcp_servers.nuxt-ui]
url = "https://ui.nuxt.com/mcp"
startup_timeout_sec = 90

[mcp_servers.nuxt]
command = "pnpm"
args = ["--reporter=silent", "dlx", "mcp-remote@0.16.5", "https://nuxt.com/mcp", "--transport", "http-only"]
startup_timeout_sec = 180

[mcp_servers.context7]
command = "pnpm"
args = ["dlx", "@upstash/context7-mcp"]

[mcp_servers.playwright]
command = "pnpm"
args = ["dlx", "@playwright/mcp@latest"]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
startup_timeout_sec = 90