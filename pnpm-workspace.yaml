minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: true
strictPeerDependencies: false
shellEmulator: true

packages:
  - apps/*
  - packages/*

overrides:
  encodeurl@^2.0.0: 2.0.0

allowBuilds:
  esbuild: true
  vue-demi@0.14.10: false

catalog:
  '@nuxt/content': ^3.16.0
  eslint-plugin-slop: ^0.1.3
  sh-syntax: 0.8.7

catalogs:
  build:
    moment: ^2.31.0
    vite: ^8.0.10
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@unocss/eslint-config': ^66.6.7
    '@unocss/eslint-plugin': ^66.6.7
    '@unocss/preset-web-fonts': ^66.6.7
    eslint: ^10.11.0
    eslint-plugin-cypress: ^7.0.4
    eslint-plugin-format: ^2.0.1
    eslint-plugin-sonarjs: ^4.2.2
    prettier: ^3.9.9
    turbo: ^2.11.5
    typescript: 6.0.3
    unocss: ^66.6.1
    vue-tsc: ^3.2.6
  frontend:
    tailwindcss: 4.3.5
    vue: ^3.5.30
  nuxt:
    '@nuxt/eslint': ^1.15.2
    '@nuxt/ui': 4.13.1
    '@unocss/nuxt': ^66.6.7
    nuxt: ^4.4.2
  shared:
    consola: ^3.4.2
    defu: ^6.1.7
    semver: ^7.7.4
    yaml: 2.8.3
  types:
    '@types/node': ^25.5.0
    '@types/semver': ^7.8.0
