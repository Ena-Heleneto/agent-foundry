name: skills-deploy-common

on:
  workflow_call:
    inputs:
      target:
        description: 部署目标，release 或 prod
        required: true
        type: string
    secrets:
      SKILL_DEPLOY_R2_ACCESS_KEY_ID:
        required: true
      SKILL_DEPLOY_R2_SECRET_ACCESS_KEY:
        required: true

concurrency:
  group: deploy-common-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建并上传技能产物
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    env:
      R2_CONFIG_PREFIX: ${{ inputs.target == 'release' && 'SKILL_DEPLOY_RELEASE_R2' || 'SKILL_DEPLOY_R2' }}
    steps:
      - name: 检出触发提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 准备 mise 工具链
        uses: jdx/mise-action@v5
        with:
          cache: 'false'

      - name: 无锁安装工作区依赖
        run: pnpm install --no-lockfile --ignore-scripts

      - name: 构建技能包依赖
        env:
          pnpm_config_lockfile: 'false'
          pnpm_config_verify_deps_before_run: 'false'
        run: pnpm --filter '@foundry/skills^...' run build

      - name: 构建技能包
        env:
          pnpm_config_lockfile: 'false'
          pnpm_config_verify_deps_before_run: 'false'
        run: pnpm --filter @foundry/skills run build --mode release

      - name: 打包技能产物
        shell: bash
        working-directory: packages/skills/dist
        run: |
          find . -type f -printf '%P\0' | LC_ALL=C sort -z |
            tar -czf ../skills.tar.gz --null --files-from=-

      - name: 记录归档 SHA-256
        shell: bash
        run: sha256sum packages/skills/skills.tar.gz >> "$GITHUB_STEP_SUMMARY"

      - name: 上传到 R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars[format('{0}_ACCOUNT_ID', env.R2_CONFIG_PREFIX)] }}
          R2_BUCKET_NAME: ${{ vars[format('{0}_BUCKET_NAME', env.R2_CONFIG_PREFIX)] }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SKILL_DEPLOY_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SKILL_DEPLOY_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          : "${AWS_ACCESS_KEY_ID:?缺少 R2 Access Key ID}" "${AWS_SECRET_ACCESS_KEY:?缺少 R2 Secret Access Key}"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID:?缺少 R2 账号 ID}.r2.cloudflarestorage.com"
          destination="s3://${R2_BUCKET_NAME:?缺少 R2 桶名}/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          version="$(<packages/skills/dist/VERSION)"

          aws s3 cp packages/skills/skills.tar.gz "$destination/skills-$version.tar.gz" --no-progress
          aws s3 cp packages/skills/dist/curl/install.sh "$destination/curl/install.sh" --no-progress
          printf '技能产物已上传至 `%s/`。\n' "$destination" >> "$GITHUB_STEP_SUMMARY"
