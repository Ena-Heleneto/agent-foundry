name: skills-deploy-common

on:
  workflow_call:
    inputs:
      target:
        description: 部署目标，release 或 prod
        required: true
        type: string
    secrets:
      SKILL_DEPLOY_R2_ACCESS_KEY_ID:
        required: true
      SKILL_DEPLOY_R2_SECRET_ACCESS_KEY:
        required: true

concurrency:
  group: deploy-common-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  R2_CONFIG_PREFIX: ${{ inputs.target == 'release' && 'SKILL_DEPLOY_RELEASE_R2' || 'SKILL_DEPLOY_R2' }}

jobs:
  build:
    name: 构建并上传技能产物
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    steps:
      - name: 检出触发提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 准备 mise 工具链
        uses: jdx/mise-action@v5
        with:
          cache: 'false'

      - name: 无锁安装工作区依赖
        run: pnpm install --no-lockfile --ignore-scripts

      - name: 构建技能包依赖
        env:
          pnpm_config_lockfile: 'false'
          pnpm_config_verify_deps_before_run: 'false'
        run: pnpm --filter '@foundry/skills^...' run build

      - name: 构建技能包
        env:
          pnpm_config_lockfile: 'false'
          pnpm_config_verify_deps_before_run: 'false'
        run: pnpm --filter @foundry/skills run build --mode release

      - name: 打包技能产物
        shell: bash
        working-directory: packages/skills/dist
        run: |
          find . -type f -printf '%P\0' | LC_ALL=C sort -z |
            tar -czf ../skills.tar.gz --null --files-from=-

      - name: 记录归档 SHA-256
        shell: bash
        run: sha256sum packages/skills/skills.tar.gz >> "$GITHUB_STEP_SUMMARY"

      - name: 上传到 R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars[format('{0}_ACCOUNT_ID', env.R2_CONFIG_PREFIX)] }}
          R2_BUCKET_NAME: ${{ vars[format('{0}_BUCKET_NAME', env.R2_CONFIG_PREFIX)] }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SKILL_DEPLOY_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SKILL_DEPLOY_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          : "${AWS_ACCESS_KEY_ID:?缺少 R2 Access Key ID}" "${AWS_SECRET_ACCESS_KEY:?缺少 R2 Secret Access Key}"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID:?缺少 R2 账号 ID}.r2.cloudflarestorage.com"
          destination="s3://${R2_BUCKET_NAME:?缺少 R2 桶名}/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          version="$(jq -er '.packageVersion | strings | select(length > 0)' packages/skills/dist/VERSION)"

          aws s3 cp packages/skills/skills.tar.gz "$destination/skills-$version.tar.gz" --no-progress
          aws s3 cp packages/skills/dist/curl/install.sh "$destination/curl/install.sh" --no-progress
          printf '技能产物已上传至 `%s/`。\n' "$destination" >> "$GITHUB_STEP_SUMMARY"

  prepare-release-table:
    name: 准备版本表
    needs: build
    # T014 接通候选制品与独立发布作业时启用。
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    outputs:
      source_missing: ${{ steps.prepare.outputs.source_missing }}
      source_etag: ${{ steps.prepare.outputs.source_etag }}
    steps:
      - name: 下载本次发布候选
        uses: actions/download-artifact@v5
        with:
          name: skills-release-candidate
          path: ${{ runner.temp }}/candidate

      - name: 下载旧版本表
        id: download-source
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars[format('{0}_ACCOUNT_ID', env.R2_CONFIG_PREFIX)] }}
          R2_BUCKET_NAME: ${{ vars[format('{0}_BUCKET_NAME', env.R2_CONFIG_PREFIX)] }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SKILL_DEPLOY_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SKILL_DEPLOY_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_CLI_ERROR_FORMAT: legacy
          AWS_MAX_ATTEMPTS: '1'
        run: ''

      - name: 确认缺失并初始化版本表
        id: initialize
        if: steps.download-source.outputs.status != '0'
        shell: bash
        env:
          DOWNLOAD_STATUS: ${{ steps.download-source.outputs.status }}
        run: |
          table_dir="$RUNNER_TEMP/skills-release-table"
          missing_key_error='^[[:space:]]*(aws: \[ERROR\]: )?An error occurred \(NoSuchKey\) when calling the GetObject operation( \(reached max retries: 0\))?:'
          if [[ "$DOWNLOAD_STATUS" != 254 || ! "$(<"$table_dir/download.error")" =~ $missing_key_error ]]; then
            cat "$table_dir/download.error" >&2
            exit "$DOWNLOAD_STATUS"
          fi
          printf '[]\n' > "$table_dir/release.previous.json"

      - name: 生成新版本表
        id: prepare
        shell: bash
        env:
          SOURCE_MISSING: ${{ steps.initialize.outcome == 'success' }}
        run: |
          table_dir="$RUNNER_TEMP/skills-release-table"
          source_etag=
          if [[ "$SOURCE_MISSING" == false ]]; then
            source_etag="$(jq -er 'strings | select(test("\\A\"[^\"[:space:][:cntrl:]]+\"\\z"))' "$table_dir/download.etag")"
          fi
          jq -es --slurpfile candidates "$RUNNER_TEMP/candidate/candidate.json" '
            def valid_entry:
              .version as $version
              | ($version | test("\\A[0-9]{8}T[0-9]{9}Z\\z"))
              and (.url
                | test("\\Ahttps://[A-Za-z0-9][A-Za-z0-9.-]*(?::[0-9]+)?/[^[:space:][:cntrl:]?#\\\\]+\\z")
                and endswith("/release/\($version)/skills.tar.gz"))
              and (.bytes | type == "number" and . > 0 and . <= 9007199254740991 and floor == .)
              and (.sha256 | test("\\A[0-9a-f]{64}\\z"));

            $candidates[0] as $candidate
            | if ($candidates | length != 1) or $candidate.archiveKey != "release/\($candidate.releaseTimestamp)/skills.tar.gz"
              then error("发布候选无效") else . end
            | {
                version: $candidate.releaseTimestamp,
                url: "\($candidate.downloadBase | rtrimstr("/"))/\($candidate.archiveKey)",
                bytes: $candidate.archiveBytes,
                sha256: $candidate.archiveSha256
              } as $entry
            | if length != 1 or (.[0] | type != "array") then error("版本表必须是单个 JSON 数组") else [$entry] + .[0] end
            | if any(.[]; valid_entry | not) then error("版本表含有无效条目") else . end
            | if (map(.version) | length != (unique | length)) then error("版本标识重复") else . end
          ' "$table_dir/release.previous.json" > "$table_dir/release.pending.json"
          mv -- "$table_dir/release.pending.json" "$table_dir/release.json"
          printf 'source_missing=%s\nsource_etag=%s\n' "$SOURCE_MISSING" "$source_etag" >> "$GITHUB_OUTPUT"

      - name: 保存新版本表制品
        uses: actions/upload-artifact@v4
        with:
          name: skills-release-table
          path: ${{ runner.temp }}/skills-release-table/release.json
          if-no-files-found: error
