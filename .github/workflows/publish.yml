name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: 构建并上传技能产物
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      pnpm_config_lockfile: 'false'
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 准备仓库工具链
        uses: jdx/mise-action@v5
        with:
          cache: 'false'

      - name: 无锁构建发布产物
        id: build
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --verify HEAD)" != "$SOURCE_REVISION" || -n "$(git status --porcelain)" ]]; then
            printf '技能发布构建需要检出指定提交的干净工作区。\n' >&2
            exit 1
          fi
          [[ ! -e pnpm-lock.yaml && ! -L pnpm-lock.yaml ]]
          pnpm install --no-lockfile --ignore-scripts
          [[ ! -e pnpm-lock.yaml && ! -L pnpm-lock.yaml ]]
          pnpm --filter @foundry/preset-config run build
          [[ ! -e pnpm-lock.yaml && ! -L pnpm-lock.yaml ]]
          pnpm --filter @foundry/skills run build --mode release
          [[ ! -e pnpm-lock.yaml && ! -L pnpm-lock.yaml ]]
          git diff --quiet HEAD --

      - name: 打包并核验本次 dist
        id: archive
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/skills-release
        run: |
          set -euo pipefail
          dist=packages/skills/dist
          [[ -d "$dist" && ! -L "$dist" ]]
          [[ "$RELEASE_DIRECTORY" = /* && ! -e "$RELEASE_DIRECTORY" && ! -L "$RELEASE_DIRECTORY" ]]
          for path in VERSION README.md LICENSE curl/skills.tsv curl/install.sh engine/install.sh engine/script/hidden-install.sh; do
            if [[ ! -f "$dist/$path" ]]; then
              printf '正式构建产物缺少 %s\n' "$path" >&2
              exit 1
            fi
          done
          invalid="$(LC_ALL=C.UTF-8 find "$dist" -regextype posix-extended -mindepth 1 \
            \( \( ! -type d ! -type f \) -o \( -type f -links +1 \) -o -regex '.*[\\[:cntrl:]].*' \) -print -quit)"
          if [[ -n "$invalid" ]]; then
            printf '正式材料需要普通目录及独立的普通文件，且路径须合法。%s\n' "$invalid" >&2
            exit 1
          fi
          version="$(node -p 'require("./packages/skills/package.json").version')"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?(\+[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?$'
          if [[ ! "$version" =~ $semver ]] || ! cmp -s "$dist/VERSION" <(printf '%s\n' "$version"); then
            printf 'dist/VERSION 与当前包版本不一致或版本格式无效。\n' >&2
            exit 1
          fi

          workspace="$(mktemp -d "${RELEASE_DIRECTORY}.XXXXXX")"
          trap 'rm -rf -- "$workspace"' EXIT
          result="$workspace/result"
          archive_name="skills-$version.tar.gz"
          archive="$result/publish/$archive_name"
          mkdir -p "$result/publish/curl" "$result/evidence" "$workspace/extracted"

          # 使用当次 dist 的全部文件，保持包内根路径。
          find "$dist" -type f -printf '%P\0' | LC_ALL=C sort -z > "$workspace/members"
          tar --create --gzip --file "$archive" --directory "$dist" --no-recursion --null --files-from="$workspace/members"
          if ! tar --list --gzip --file "$archive" --quoting-style=literal | tr '\n' '\0' | cmp -s "$workspace/members" - ||
            ! tar --list --verbose --gzip --file "$archive" --quoting-style=literal | awk '!/^-/ { exit 1 }'; then
            printf '归档成员类型或路径与当次 dist 不一致。\n' >&2
            exit 1
          fi
          tar --extract --gzip --file "$archive" --directory "$workspace/extracted" --no-same-owner --no-same-permissions
          while IFS= read -r -d '' path; do
            cmp -- "$dist/$path" "$workspace/extracted/$path"
          done < "$workspace/members"
          cp -- "$dist/curl/install.sh" "$result/publish/curl/install.sh"
          cmp -- "$workspace/extracted/curl/install.sh" "$result/publish/curl/install.sh"

          python - "$workspace" "$version" "$archive_name" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          workspace, version, archive_name = sys.argv[1:]
          workspace = Path(workspace)
          publish = workspace / "result/publish"
          paths = os.fsdecode((workspace / "members").read_bytes()).split("\0")[:-1]

          def record(root, path):
              data = (root / path).read_bytes()
              return {"path": path, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          report = {
              "formatVersion": 1,
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "version": version,
              "archive": record(publish, archive_name),
              "entry": record(publish, "curl/install.sh"),
              "files": [record(workspace / "extracted", path) for path in paths],
          }
          (workspace / "result/evidence/build-verification.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          PY
          mv --no-target-directory -- "$result" "$RELEASE_DIRECTORY"

      - name: 记录构建依赖与工具
        id: build-evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/skills-release
        run: |
          set -euo pipefail
          pnpm --filter '@foundry/skills...' list --depth Infinity --json > "$RELEASE_DIRECTORY/evidence/dependencies.json"
          {
            printf 'sourceRevision=%s\n' "$SOURCE_REVISION"
            printf 'node=%s\n' "$(node --version)"
            printf 'pnpm=%s\n' "$(pnpm --version)"
            git --version
            tar --version
            mise --version
          } > "$RELEASE_DIRECTORY/evidence/tools.txt"
          [[ ! -e pnpm-lock.yaml && ! -L pnpm-lock.yaml ]]

      - name: 保留本次核验证据
        uses: actions/upload-artifact@v4
        with:
          name: skills-build-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skills-release/evidence
          if-no-files-found: error

      - name: 检查 R2 配置
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?请配置 R2_ACCOUNT_ID 仓库变量}"
          : "${R2_BUCKET_NAME:?请配置 R2_BUCKET_NAME 仓库变量}"
          : "${AWS_ACCESS_KEY_ID:?请配置 R2_ACCESS_KEY_ID Secret}"
          : "${AWS_SECRET_ACCESS_KEY:?请配置 R2_SECRET_ACCESS_KEY Secret}"
          aws --version

      - name: 上传本次归档和安装入口到 R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'skills-builds' }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/skills-release/publish
        run: |
          set -euo pipefail
          destination="s3://${R2_BUCKET_NAME}/${R2_PREFIX%/}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          aws s3 cp "$RELEASE_DIRECTORY/" "$destination" \
            --recursive --only-show-errors \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          printf '技能产物已上传至 `%s`\n' "$destination" >> "$GITHUB_STEP_SUMMARY"
