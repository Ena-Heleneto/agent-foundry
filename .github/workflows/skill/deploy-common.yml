name: skill-deploy-common

on:
  workflow_call:
    inputs:
      target:
        description: 目标 GitHub Environment，release 或 prod
        required: true
        type: string
    secrets:
      SKILL_DEPLOY_R2_ACCESS_KEY_ID:
        required: true
      SKILL_DEPLOY_R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: 检查部署目标
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 检查目标环境
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" != release && "$TARGET" != prod ]]; then
            printf '目标环境必须是 release 或 prod。\n' >&2
            exit 1
          fi

  deploy:
    name: 构建并上传技能产物
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.target }}
    steps:
      - name: 检查 R2 配置
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.SKILL_DEPLOY_R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.SKILL_DEPLOY_R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SKILL_DEPLOY_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SKILL_DEPLOY_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?请配置目标环境变量 SKILL_DEPLOY_R2_ACCOUNT_ID}"
          : "${R2_BUCKET_NAME:?请配置目标环境变量 SKILL_DEPLOY_R2_BUCKET_NAME}"
          : "${AWS_ACCESS_KEY_ID:?请配置目标环境 Secret SKILL_DEPLOY_R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?请配置目标环境 Secret SKILL_DEPLOY_R2_SECRET_ACCESS_KEY}"
          aws --version

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并导出 dist
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/skills/deploy/Dockerfile
          target: artifacts
          outputs: type=local,dest=${{ runner.temp }}/skills-dist

      - name: 检查导出产物
        shell: bash
        env:
          DIST_DIRECTORY: ${{ runner.temp }}/skills-dist
        run: |
          set -euo pipefail
          for path in skills.tar.gz VERSION curl/install.sh; do
            file="$DIST_DIRECTORY/$path"
            if [[ ! -f "$file" || ! -s "$file" || -L "$file" ]]; then
              printf '构建产物缺失或无效：%s\n' "$path" >&2
              exit 1
            fi
          done
          tar -tzf "$DIST_DIRECTORY/skills.tar.gz" >/dev/null

      - name: 上传 dist 到 R2
        shell: bash
        env:
          DIST_DIRECTORY: ${{ runner.temp }}/skills-dist
          R2_ACCOUNT_ID: ${{ vars.SKILL_DEPLOY_R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.SKILL_DEPLOY_R2_BUCKET_NAME }}
          R2_PREFIX: ${{ vars.SKILL_DEPLOY_R2_PREFIX || 'skills-builds' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SKILL_DEPLOY_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SKILL_DEPLOY_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          destination="s3://${R2_BUCKET_NAME}/${R2_PREFIX%/}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          aws s3 cp "$DIST_DIRECTORY/" "$destination" \
            --recursive --no-follow-symlinks --only-show-errors \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          printf '技能产物已上传至 `%s`\n' "$destination" >> "$GITHUB_STEP_SUMMARY"
