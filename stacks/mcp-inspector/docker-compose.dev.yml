# 线下测试编排：起服后经 Inspector CLI 一次性冒烟验证能力清单（MVU-C）。
# 用法：
#   docker compose -f stacks/mcp-inspector/docker-compose.dev.yml up -d
#   curl -sf http://127.0.0.1:8787/healthz
#   docker compose -f stacks/mcp-inspector/docker-compose.dev.yml run inspector-cli
#   docker compose -f stacks/mcp-inspector/docker-compose.dev.yml down
name: mcp-inspector-dev

services:
  mcp-server:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /repo/apps/mcp
    command: ["uv", "run", "foundry-skills-mcp", "--http", "--host", "0.0.0.0"]
    volumes:
      - ../../:/repo:ro
      - uv-cache:/opt/uv-cache
      - mcp-venv:/opt/venv
    environment:
      UV_CACHE_DIR: /opt/uv-cache
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  # 一次性冒烟服务：健康检查通过后连接服务器列出能力清单，退出码即冒烟结果。
  inspector-cli:
    image: node:22-slim
    depends_on:
      mcp-server:
        condition: service_healthy
    command:
      [
        "npx",
        "-y",
        "@modelcontextprotocol/inspector",
        "--cli",
        "http://mcp-server:8787/mcp",
        "--method",
        "tools/list",
      ]

volumes:
  uv-cache:
  mcp-venv:
