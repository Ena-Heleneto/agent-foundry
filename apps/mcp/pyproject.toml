[project]
name = "foundry-skills-mcp"
version = "0.1.0"
description = "ENA Foundry 自定义 skill 收束 MCP 服务器（stdio 本地调用 / Streamable HTTP 自托管部署）"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.13",
]

[project.scripts]
foundry-skills-mcp = "foundry_skills_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
